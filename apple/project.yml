name: BeeHive
options:
  bundleIdPrefix: is.eightb
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
packages:
  BeeHivePackage:
    path: .
targets:
  BeeHive-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/BeeHiveApp
      - path: ../web/index.html
        buildPhase: resources
    dependencies:
      - package: BeeHivePackage
        product: BeeHiveKit
    info:
      path: Generated/BeeHive-iOS-Info.plist
      properties:
        CFBundleDisplayName: BeeHive
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "100"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BeeHive-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/BeeHiveApp
      - path: ../web/index.html
        buildPhase: resources
    dependencies:
      - package: BeeHivePackage
        product: BeeHiveKit
    info:
      path: Generated/BeeHive-macOS-Info.plist
      properties:
        CFBundleDisplayName: BeeHive
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "100"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "8b-is"
